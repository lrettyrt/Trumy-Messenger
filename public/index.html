<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trumy — Messenger</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
 
  <!-- ═══════════ AUTH SCREEN ═══════════ -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon">T</div>
        <h1>Trumy</h1>
        <p class="auth-subtitle">Мессенджер для общения</p>
      </div>
 
      <!-- Login Form -->
      <form id="login-form" class="auth-form">
        <h2>Вход</h2>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="your@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <div id="login-error" class="form-error"></div>
        <button type="submit" class="btn-primary">Войти</button>
        <p class="auth-switch">Нет аккаунта? <a href="#" id="show-register">Создать</a></p>
      </form>
 
      <!-- Register Form -->
      <form id="register-form" class="auth-form hidden">
        <h2>Регистрация</h2>
        <div class="form-group">
          <label>Имя пользователя</label>
          <input type="text" id="reg-username" placeholder="username" required minlength="2" maxlength="32" autocomplete="username">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="reg-email" placeholder="your@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="reg-password" placeholder="••••••••" required minlength="4" autocomplete="new-password">
        </div>
        <div id="register-error" class="form-error"></div>
        <button type="submit" class="btn-primary">Создать аккаунт</button>
        <p class="auth-switch">Есть аккаунт? <a href="#" id="show-login">Войти</a></p>
      </form>
    </div>
  </div>
 
  <!-- ═══════════ MAIN CHAT ═══════════ -->
  <div id="chat-screen" class="chat-screen hidden">
 
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-small">
          <span class="logo-icon-sm">T</span>
          <span>Trumy</span>
        </div>
        <button id="btn-new-channel" class="icon-btn" title="Создать канал">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
 
      <!-- Channels -->
      <div class="sidebar-section">
        <div class="section-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>
          Каналы
        </div>
        <ul id="channels-list" class="nav-list"></ul>
      </div>
 
      <!-- DMs -->
      <div class="sidebar-section">
        <div class="section-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Личные сообщения
        </div>
        <ul id="dm-list" class="nav-list"></ul>
      </div>
 
      <!-- User Panel -->
      <div class="user-panel">
        <div class="user-info">
          <div id="user-avatar" class="avatar-sm"></div>
          <div id="user-name" class="user-display-name"></div>
        </div>
        <button id="btn-logout" class="icon-btn" title="Выйти">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </aside>
 
    <!-- Chat Area -->
    <main class="chat-main">
      <!-- Chat Header -->
      <div class="chat-header">
        <button id="sidebar-toggle" class="icon-btn mobile-only">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="chat-header-info">
          <h2 id="chat-title"># general</h2>
          <span id="chat-description" class="chat-desc"></span>
        </div>
        <div class="chat-header-actions">
          <button id="btn-members" class="icon-btn" title="Участники">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </button>
        </div>
      </div>
 
      <!-- Messages -->
      <div id="messages-container" class="messages-container">
        <div id="messages-list" class="messages-list"></div>
      </div>
 
      <!-- Typing Indicator -->
      <div id="typing-indicator" class="typing-indicator hidden">
        <span class="typing-dots"><span></span><span></span><span></span></span>
        <span id="typing-text"></span>
      </div>
 
      <!-- Message Input -->
      <div class="message-input-area">
        <div id="reply-preview" class="reply-preview hidden">
          <span id="reply-text"></span>
          <button id="reply-cancel" class="icon-btn-sm">&times;</button>
        </div>
        <div class="input-row">
          <label class="icon-btn file-upload-btn" title="Прикрепить файл">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            <input type="file" id="file-input" hidden>
          </label>
          <textarea id="message-input" placeholder="Написать сообщение..." rows="1"></textarea>
          <button id="btn-send" class="send-btn" title="Отправить">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </main>
 
    <!-- Members Sidebar -->
    <aside id="members-panel" class="members-panel hidden">
      <div class="members-header">
        <h3>Участники</h3>
        <button id="close-members" class="icon-btn">&times;</button>
      </div>
      <div class="members-section">
        <div class="members-section-title">Онлайн — <span id="online-count">0</span></div>
        <ul id="online-members" class="members-list"></ul>
      </div>
      <div class="members-section">
        <div class="members-section-title">Все пользователи</div>
        <ul id="all-members" class="members-list"></ul>
      </div>
    </aside>
  </div>
 
  <!-- ═══════════ CREATE CHANNEL MODAL ═══════════ -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3>Создать канал</h3>
        <button id="modal-close" class="icon-btn">&times;</button>
      </div>
      <form id="create-channel-form">
        <div class="form-group">
          <label>Название</label>
          <input type="text" id="channel-name-input" placeholder="новый-канал" required maxlength="40">
        </div>
        <div class="form-group">
          <label>Описание (необязательно)</label>
          <input type="text" id="channel-desc-input" placeholder="О чём этот канал?" maxlength="200">
        </div>
        <button type="submit" class="btn-primary">Создать</button>
      </form>
    </div>
  </div>
 
  <script src="/js/app.js"></script>
</body>
</html>
